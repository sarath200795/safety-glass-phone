<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Safety Glass – GHS / First aid</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}
#st{position:fixed;inset:0 0 150px 0;overflow:hidden}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#lbl{position:absolute;top:8px;left:8px;right:8px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:10px;font-size:18px;z-index:2}
#bar{position:fixed;left:0;right:0;bottom:0;height:150px;padding:8px;background:#111;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
button{flex:1 1 30%;min-height:52px;border:0;border-radius:10px;font-size:16px;font-weight:700;color:#fff;background:#333}.g{background:#0a7d2c}
label{font-size:14px;flex:1 1 100%}input[type=range]{width:60%;vertical-align:middle}</style></head><body>
<div id="st"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas><div id="lbl">GHS / First-aid detector – loading model…</div></div>
<div id="bar"><button id="go" class="g">▶ Start camera</button><button id="sw">Switch camera</button><button onclick="location.href='index.html'">Defect &amp; Audit</button><button onclick="location.href='hazard.html'">Hazard scan</button>
<label>Confidence <span id="cv"></span> <input id="c" type="range" min="0.1" max="0.9" step="0.05"></label></div>
<script src="ort.wasm.min.js"></script><script src="ghs.js"></script></body></html>
